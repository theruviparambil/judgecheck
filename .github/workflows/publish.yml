name: Publish

# Publishes to PyPI through Trusted Publishing: PyPI trusts this workflow's
# OIDC identity, so no API token exists anywhere. Runs only on a version tag,
# and refuses a tag that does not match the version in pyproject.toml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/judgecheck
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tag matches pyproject version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }

      - name: Test
        run: |
          pip install -e ".[dev]"
          pytest -q

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
